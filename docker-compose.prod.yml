version: '3.8'

services:
  # 1. Base de Datos Relacional PostgreSQL 17 (Amazon RDS Multi-AZ Simulado)
  db:
    image: postgres:17-alpine
    container_name: case_postgres_prod
    environment:
      POSTGRES_DB: case_collaborative_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d case_collaborative_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Caché y Memoria Distribuida (AWS ElastiCache Redis Simulado)
  redis:
    image: redis:7-alpine
    container_name: case_redis_prod
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redis_secure_pass_2026"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_pass_2026", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always

  # 3. Microservicio de Visión Computacional (FastAPI + OpenCV)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: case_ai_vision_prod
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    restart: always

  # 4. Backend Node.js + Socket.IO (AWS ECS Fargate Task)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: case_backend_prod
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: case_collaborative_db
      DB_USER: postgres
      DB_PASSWORD: postgres_secure_password_2026
      JWT_SECRET: production_jwt_super_secret_key_sw1_2026
      AI_SERVICE_URL: http://ai-service:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secure_pass_2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # 5. Frontend Nginx + Reverse Proxy (Application Load Balancer Ingress)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: case_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
